---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: suzuki-shunsuke/go-autofix-action@ad61a60b1ab7061f3adca50247830727f0aa4df2 # v0.2.2
        with:
          aqua_version: v2.65.2
          takumi_guard_bot_id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
